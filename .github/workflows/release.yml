name: Release

# Push a tag like v0.3.0 -> test, build, publish to PyPI with Trusted
# Publishing (GitHub OIDC; no stored token). PyPI side: project irl-sdk ->
# Publishing -> GitHub, owner norve-labs, repo irl-sdk-python,
# workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "$VERSION" || { echo "tag $TAG != pyproject $VERSION"; exit 1; }
      - run: pip install -e ".[dev]" build
      - run: pytest -q
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
